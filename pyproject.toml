[project]
name = "m06-lab-estatistica"
version = "0.1.0"
description = "Labs de estatística (notebooks)"
authors = [
    { name = "Caio Semblano", email = "semblanocaio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
